<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d182e" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pulse Filter for Background Nodes -->
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }

      /* Animated Network Grid & Nodes in Background */
      @keyframes floatBeam1 {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: -400; opacity: 0.2; }
      }
      @keyframes floatBeam2 {
        0% { stroke-dashoffset: -300; opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: 300; opacity: 0.3; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.35); opacity: 0.9; }
      }
      @keyframes orbitFlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .beam-line1 {
        stroke: #38bdf8;
        stroke-dasharray: 80 120;
        animation: floatBeam1 8s linear infinite;
      }
      .beam-line2 {
        stroke: #a855f7;
        stroke-dasharray: 60 140;
        animation: floatBeam2 10s linear infinite;
      }
      .pulse-circle {
        transform-origin: center;
        animation: pulseNode 4s ease-in-out infinite;
      }
      .pulse-circle-delayed {
        transform-origin: center;
        animation: pulseNode 5s ease-in-out 2s infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="336" x="2" y="2" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Dynamic Animated Background Data Streams (Behind text) -->
  <g opacity="0.35">
    <!-- Grid Matrix Lines -->
    <path d="M 0 60 L 1200 60 M 0 140 L 1200 140 M 0 220 L 1200 220 M 0 300 L 1200 300" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M 150 0 L 150 340 M 350 0 L 350 340 M 600 0 L 600 340 M 850 0 L 850 340 M 1050 0 L 1050 340" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" />

    <!-- Animated Data Highways -->
    <path d="M -50 280 C 250 240, 400 320, 700 270 S 1000 310, 1250 260" fill="none" stroke-width="2.5" class="beam-line1" filter="url(#glow)" />
    <path d="M -50 70 C 200 110, 500 40, 800 80 S 1100 30, 1250 60" fill="none" stroke-width="2" class="beam-line2" filter="url(#glow)" />
    <path d="M -50 180 C 300 210, 600 130, 900 190 S 1150 150, 1250 170" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="50 100" class="beam-line1" />

    <!-- Ambient Floating Data Nodes -->
    <circle cx="150" cy="60" r="18" fill="#0284c7" class="pulse-circle" filter="url(#pulseGlow)" />
    <circle cx="1050" cy="220" r="22" fill="#7c3aed" class="pulse-circle-delayed" filter="url(#pulseGlow)" />
    <circle cx="850" cy="80" r="14" fill="#38bdf8" class="pulse-circle" />
    <circle cx="280" cy="270" r="16" fill="#818cf8" class="pulse-circle-delayed" />
  </g>

  <!-- Foreground Content: Header Badge -->
  <g transform="translate(600, 58)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="-118" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="6" y="5" text-anchor="middle" class="tag-text">DISTRIBUTED DATA ECOSYSTEM</text>
  </g>

  <!-- Main Title in Foreground -->
  <text x="600" y="132" text-anchor="middle" fill="url(#titleGrad)" class="title-text" filter="url(#glow)">
    Awesome Big Data Frameworks
  </text>

  <!-- Subtitle in Foreground -->
  <text x="600" y="174" text-anchor="middle" fill="url(#subGrad)" class="subtitle-text">
    Distributed Computing • Stream Processing • Cloud Lakehouses • Open Platforms
  </text>

  <!-- Modern Capability Chips in Foreground -->
  <g transform="translate(600, 245)">
    <!-- Chip 1: Spark & Flink -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-20" width="190" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">⚡ Spark &amp; Flink</text>
    </g>

    <!-- Chip 2: Kafka & Streaming -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-20" width="190" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🌊 Kafka &amp; Pulsar</text>
    </g>

    <!-- Chip 3: Iceberg & Delta Lake -->
    <g transform="translate(120, 0)">
      <rect x="-95" y="-20" width="190" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🧊 Iceberg &amp; Delta</text>
    </g>

    <!-- Chip 4: Trino & ClickHouse -->
    <g transform="translate(360, 0)">
      <rect x="-95" y="-20" width="190" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🚀 Trino &amp; ClickHouse</text>
    </g>
  </g>

  <!-- Interactive Bottom Edge Line -->
  <line x1="200" y1="304" x2="1000" y2="304" stroke="#334155" stroke-width="1" />
  <circle cx="600" cy="304" r="3" fill="#818cf8" />
</svg>
