<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Title & Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="beamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="beamGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Clean CSS Animations for High-Speed Data Highways in Background */
      @keyframes streamFlow1 {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: -600; }
      }
      @keyframes streamFlow2 {
        0% { stroke-dashoffset: -500; }
        100% { stroke-dashoffset: 500; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.85; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.2; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      .beam-stream-1 {
        stroke: url(#beamGrad1);
        stroke-dasharray: 120 180;
        animation: streamFlow1 7s linear infinite;
      }
      .beam-stream-2 {
        stroke: url(#beamGrad2);
        stroke-dasharray: 90 150;
        animation: streamFlow2 9s linear infinite;
      }
      .ambient-glow {
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .pulse-node {
        transform-origin: center;
        animation: pulseDot 3s ease-in-out infinite;
      }
      .pulse-node-alt {
        transform-origin: center;
        animation: pulseDot 4s ease-in-out 1.5s infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="336" x="2" y="2" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- DYNAMIC BACKGROUND LAYER: Animated Data Highway & Distributed Nodes -->
  <g>
    <!-- Background Grid lines -->
    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6" opacity="0.6">
      <line x1="0" y1="75" x2="1200" y2="75" />
      <line x1="0" y1="160" x2="1200" y2="160" />
      <line x1="0" y1="245" x2="1200" y2="245" />
      <line x1="200" y1="0" x2="200" y2="340" />
      <line x1="400" y1="0" x2="400" y2="340" />
      <line x1="600" y1="0" x2="600" y2="340" />
      <line x1="800" y1="0" x2="800" y2="340" />
      <line x1="1000" y1="0" x2="1000" y2="340" />
    </g>

    <!-- Ambient Glowing Clusters in Background Corners -->
    <circle cx="160" cy="80" r="120" fill="#0284c7" opacity="0.12" class="ambient-glow" />
    <circle cx="1040" cy="260" r="140" fill="#7c3aed" opacity="0.12" class="ambient-glow" />

    <!-- Animated Data Highways (Curved Beams) -->
    <path d="M -50 280 C 250 210, 450 320, 750 260 S 1050 310, 1250 250" fill="none" stroke-width="3" class="beam-stream-1" />
    <path d="M -50 65 C 220 120, 520 40, 820 85 S 1080 30, 1250 60" fill="none" stroke-width="3" class="beam-stream-2" />
    <path d="M -50 170 C 300 205, 620 135, 900 185 S 1120 150, 1250 170" fill="none" stroke="url(#beamGrad1)" stroke-width="2" stroke-dasharray="70 110" class="beam-stream-1" opacity="0.5" />

    <!-- Pulsing Distributed Cluster Nodes -->
    <circle cx="140" cy="70" r="6" fill="#38bdf8" class="pulse-node" />
    <circle cx="140" cy="70" r="16" fill="none" stroke="#38bdf8" stroke-width="1" class="pulse-node" opacity="0.5" />

    <circle cx="1060" cy="270" r="6" fill="#c084fc" class="pulse-node-alt" />
    <circle cx="1060" cy="270" r="16" fill="none" stroke="#c084fc" stroke-width="1" class="pulse-node-alt" opacity="0.5" />

    <circle cx="880" cy="95" r="5" fill="#818cf8" class="pulse-node" />
    <circle cx="280" cy="255" r="5" fill="#38bdf8" class="pulse-node-alt" />
  </g>

  <!-- FOREGROUND LAYER: Content remains crisp and never occluded -->
  
  <!-- Category Pill Badge -->
  <g transform="translate(600, 58)">
    <rect x="-145" y="-16" width="290" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="-120" cy="0" r="4" fill="#38bdf8" class="pulse-node" />
    <text x="6" y="4.5" text-anchor="middle" class="badge-label">DISTRIBUTED DATA ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="132" text-anchor="middle" fill="url(#titleGrad)" class="title-text">
    Awesome Big Data Frameworks
  </text>

  <!-- Subtitle -->
  <text x="600" y="174" text-anchor="middle" class="subtitle-text">
    Distributed Computing • Stream Processing • Cloud Lakehouses • Open Platforms
  </text>

  <!-- Capability Cards/Pills in Foreground -->
  <g transform="translate(600, 245)">
    <!-- Pill 1: Spark & Flink -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-20" width="190" height="40" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">⚡ Spark &amp; Flink</text>
    </g>

    <!-- Pill 2: Kafka & Pulsar -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-20" width="190" height="40" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">🌊 Kafka &amp; Pulsar</text>
    </g>

    <!-- Pill 3: Iceberg & Delta Lake -->
    <g transform="translate(120, 0)">
      <rect x="-95" y="-20" width="190" height="40" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">🧊 Iceberg &amp; Delta</text>
    </g>

    <!-- Pill 4: Trino & ClickHouse -->
    <g transform="translate(360, 0)">
      <rect x="-95" y="-20" width="190" height="40" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">🚀 Trino &amp; ClickHouse</text>
    </g>
  </g>

  <!-- Bottom Accent Divider -->
  <line x1="250" y1="304" x2="950" y2="304" stroke="#334155" stroke-width="1" />
  <circle cx="600" cy="304" r="3" fill="#818cf8" />
</svg>
